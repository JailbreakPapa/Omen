name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'src/**'
      - '.github/workflows/docs.yml'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build .NET (emit XML docs)
        run: dotnet build Omen.sln -c Release
      - name: Skip DocFX (manual API docs)
        run: echo "Using manual API docs under docs-site/docs/api/ (DocFX generation removed)"
      - name: Build Docusaurus
        run: |
          cd docs-site
          npm ci
          npm run build
      - name: Link check (optional)
        run: echo "Run link checks here (linkinator or similar)"
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-build
          path: docs-site/build
